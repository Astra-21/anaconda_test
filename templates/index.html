{% extends 'base.html'%}
{% block content %}

<h1>トップページ</h1>

<table border="1">
        
    <tr>
        <th>ID</th>
        <th>タイトル</th>
        <th>本文</th>
        <th>作成日時</th>
        <th>画像</th>
        <th>詳細</th>
    </tr>
    {% for record in records %}
    <tr>
        <td>{{ record.id }}</td>
        <td>{{ record.title }}</td>
        <td>{{ record.body }}</td>
        <td>{{ record.created_at }}</td>
        <td>{% if record.image %}
            <img src="{{ url_for('static', filename='img/' + record.image) }}" width="100" height="100">
        {% else %}
            No Image
        {% endif %}
        </td>
        <td><a href="{{record.id }}/readMore"><button>詳細</button></a></td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
